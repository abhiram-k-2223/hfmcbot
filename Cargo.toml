[package]
name = "hfmcbot"
version = "0.1.0"
edition = "2021"
description = "SOL meme new-launch spray + let-winners-run bot (paper mode first)"

[dependencies]
tokio = { version = "1", features = ["full"] }
rust_decimal = { version = "1", features = ["maths"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
solana-keypair = "3.1.2"
bs58 = "0.5.1"
yellowstone-grpc-client = "13.5.0"
yellowstone-grpc-proto = "12.7.0"
tokio-stream = "0.1.19"
tonic = "0.14.6"
futures-util = "0.3.34"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
solana-transaction = { version = "3", features = ["bincode", "serde"] }
solana-message = "3"
solana-pubkey = "4"
solana-hash = "3"
solana-signature = "3"
base64 = "0.22"
bincode = "1.3"
tokio-postgres = { version = "0.7.18", optional = true, features = ["with-chrono-0_4"] }

[dev-dependencies]
tempfile = "3"

[features]
# Postgres audit mirror (roadmap): opt-in so default builds stay light and
# fully offline-testable. `--features pg` pulls tokio-postgres.
pg = ["dep:tokio-postgres"]
